{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Добавить запись ухода{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4>➕ Добавить запись ухода</h4>
                <p class="text-muted">Растение: <strong>{{ plant.name }}</strong></p>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> Добавить
                        </button>
                        <a href="{% url 'plants:detail' plant.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
