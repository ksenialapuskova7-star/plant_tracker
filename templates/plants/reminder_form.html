{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4>{{ title }}</h4>
                {% if plant %}
                    <p class="text-muted">Растение: <strong>{{ plant.name }}</strong></p>
                {% endif %}
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> {{ button_text }}
                        </button>
                        <a href="{% if plant %}{% url 'plants:detail' plant.pk %}{% else %}{% url 'plants:list' %}{% endif %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
